
name: Build Bille APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: |
          unzip -o Bille_proyecto_completo.zip -d proyecto

      - name: Encontrar proyecto Android
        run: |
          find proyecto -name settings.gradle -o -name settings.gradle.kts

      - name: Compilar APK
        run: |
          PROYECTO=$(find proyecto -name settings.gradle -type f -printf '%h\n' | head -n 1)
          if [ -z "$PROYECTO" ]; then
            PROYECTO=$(find proyecto -name settings.gradle.kts -type f -printf '%h\n' | head -n 1)
          fi
          if [ -z "$PROYECTO" ]; then
            echo "No se encontró un proyecto Android Gradle dentro del ZIP."
            exit 1
          fi
          echo "Proyecto encontrado: $PROYECTO"
          gradle -p "$PROYECTO" assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Bille-APK
          path: proyecto/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
