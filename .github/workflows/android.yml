
name: Build Bille APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: |
          unzip -o Bille_proyecto_completo.zip -d proyecto
          find proyecto -maxdepth 4 -type f

      - name: Compilar APK
        run: |
          gradle -p proyecto/Bille assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Bille-APK
          path: proyecto/Bille/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
